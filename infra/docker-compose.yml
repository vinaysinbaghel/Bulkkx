version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bulkkx-postgres
    restart: always
    environment:
      POSTGRES_USER: bulkkx_user
      POSTGRES_PASSWORD: bulkkx_password
      POSTGRES_DB: bulkkx_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bulkkx_user -d bulkkx_db']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: bulkkx-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3

  mailpit:
    image: axllent/mailpit:latest
    container_name: bulkkx-mailpit
    restart: always
    ports:
      - '1025:1025' # SMTP port
      - '8025:8025' # Web UI port

  clamav:
    image: clamav/clamav:latest
    container_name: bulkkx-clamav
    restart: always
    ports:
      - '3310:3310'

volumes:
  postgres_data:
  minio_data:
