packages:
  - 'packages/*'
  - 'apps/*'

# Supply-chain security settings (Section 18.7)
minimumReleaseAge: 2880 # 48 hours minimum age on npm
blockExoticSubdeps: true

allowBuilds:
  esbuild: true
  argon2: true
  pg: true
  lefthook: true
  '@sentry/cli': true
  '@swc/core': true
  '@scarf/scarf': false
  cpu-features: false
  protobufjs: false
  ssh2: false
